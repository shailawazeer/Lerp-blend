<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LERP Shape Blender</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      :root {
        --bg: #0d0d0f;
        --surface: #16161a;
        --surface2: #1e1e24;
        --border: rgba(255, 255, 255, 0.07);
        --col-a: #4a9eff;
        --col-b: #ff6b4a;
        --col-p: #4affa0;
        --text: #e8e8e8;
        --muted: #666;
        --mono: "Space Mono", monospace;
        --sans: "DM Sans", sans-serif;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem 1rem;
        gap: 1.5rem;
      }

      header {
        text-align: center;
      }
      header h1 {
        font-family: var(--mono);
        font-size: clamp(1.2rem, 4vw, 1.8rem);
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--text);
      }
      header p {
        font-size: 0.85rem;
        color: var(--muted);
        margin-top: 0.4rem;
        font-weight: 300;
      }

      .legend {
        display: flex;
        gap: 1.5rem;
        font-family: var(--mono);
        font-size: 0.75rem;
      }
      .legend span {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
      }

      .canvas-wrap {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        overflow: hidden;
        width: 100%;
        max-width: 680px;
      }
      canvas {
        display: block;
        width: 100%;
      }

      .controls {
        width: 100%;
        max-width: 680px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 1.4rem 1.6rem;
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }

      .slider-row {
        display: flex;
        align-items: center;
        gap: 14px;
      }
      .slider-label {
        font-family: var(--mono);
        font-size: 0.72rem;
        min-width: 60px;
        white-space: nowrap;
      }
      .slider-label.a {
        color: var(--col-a);
      }
      .slider-label.b {
        color: var(--col-b);
        text-align: right;
      }

      input[type="range"] {
        flex: 1;
        -webkit-appearance: none;
        appearance: none;
        height: 4px;
        border-radius: 2px;
        background: linear-gradient(
          to right,
          var(--col-a) var(--pct, 50%),
          var(--col-b) var(--pct, 50%)
        );
        outline: none;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--col-p);
        border: 3px solid var(--bg);
        box-shadow: 0 0 0 1px var(--col-p);
        transition: transform 0.1s;
      }
      input[type="range"]:active::-webkit-slider-thumb {
        transform: scale(1.2);
      }
      input[type="range"]::-moz-range-thumb {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--col-p);
        border: 3px solid var(--bg);
      }

      .t-display {
        text-align: center;
        font-family: var(--mono);
        font-size: 0.8rem;
      }
      .t-display .tval {
        font-size: 1.5rem;
        font-weight: 700;
        color: var(--col-p);
        display: block;
        line-height: 1.1;
      }
      .t-display .formula {
        color: var(--muted);
        font-size: 0.7rem;
        margin-top: 3px;
      }
      .formula span.fa {
        color: var(--col-a);
      }
      .formula span.fb {
        color: var(--col-b);
      }

      .table-wrap {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-family: var(--mono);
        font-size: 0.7rem;
      }
      th {
        color: var(--muted);
        text-align: center;
        padding: 4px 8px;
        border-bottom: 1px solid var(--border);
        font-weight: 400;
        letter-spacing: 0.05em;
      }
      td {
        text-align: center;
        padding: 5px 8px;
        border-bottom: 1px solid var(--border);
      }
      td.ca {
        color: var(--col-a);
      }
      td.cb {
        color: var(--col-b);
      }
      td.cp {
        color: var(--col-p);
        font-weight: 700;
      }
      td.cn {
        color: var(--muted);
      }

      .btn-row {
        display: flex;
        gap: 8px;
        justify-content: center;
      }
      button {
        font-family: var(--mono);
        font-size: 0.7rem;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: var(--surface2);
        color: var(--muted);
        cursor: pointer;
        transition: all 0.15s;
        letter-spacing: 0.04em;
      }
      button:hover {
        border-color: var(--col-p);
        color: var(--col-p);
      }
      button.active {
        border-color: var(--col-p);
        color: var(--col-p);
        background: rgba(74, 255, 160, 0.08);
      }

      .animate-btn {
        font-family: var(--mono);
        font-size: 0.72rem;
        padding: 7px 20px;
        border-radius: 6px;
        border: 1px solid var(--col-p);
        background: rgba(74, 255, 160, 0.1);
        color: var(--col-p);
        cursor: pointer;
        transition: all 0.15s;
      }
      .animate-btn:hover {
        background: rgba(74, 255, 160, 0.2);
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LERP Shape Blender</h1>
      <p>P(t) = (1 − t) · A + t · B</p>
    </header>

    <div class="legend">
      <span
        ><div class="dot" style="background: var(--col-a)"></div>
        Shape A — Square</span
      >
      <span
        ><div class="dot" style="background: var(--col-b)"></div>
        Shape B — Wedge</span
      >
      <span
        ><div class="dot" style="background: var(--col-p)"></div>
        P(t) — Blend</span
      >
    </div>

    <div class="canvas-wrap">
      <canvas id="c" height="420"></canvas>
    </div>

    <div class="controls">
      <div
        style="
          display: flex;
          align-items: center;
          gap: 1.5rem;
          flex-wrap: wrap;
          justify-content: center;
        "
      >
        <div class="t-display">
          <span class="tval" id="tval">0.50</span>
          <div class="formula" id="formula">
            P = <span class="fa">0.50 × A</span> +
            <span class="fb">0.50 × B</span>
          </div>
        </div>
        <button class="animate-btn" id="animBtn">▶ Animate</button>
      </div>

      <div class="slider-row">
        <span class="slider-label a">t = 0<br />Shape A</span>
        <input type="range" id="slider" min="0" max="100" value="50" step="1" />
        <span class="slider-label b">t = 1<br />Shape B</span>
      </div>

      <div class="btn-row">
        <button id="b0">t = 0</button>
        <button id="b25">t = 0.25</button>
        <button class="active" id="b50">t = 0.50</button>
        <button id="b75">t = 0.75</button>
        <button id="b100">t = 1</button>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th style="color: #4a9eff">Shape A</th>
              <th style="color: #888">weight A</th>
              <th style="color: #ff6b4a">Shape B</th>
              <th style="color: #888">weight B</th>
              <th style="color: #4affa0">P(t)</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
    </div>

    <script>
      const canvas = document.getElementById("c");
      const ctx = canvas.getContext("2d");
      const slider = document.getElementById("slider");
      const tvalEl = document.getElementById("tval");
      const formulaEl = document.getElementById("formula");
      const tbody = document.getElementById("tbody");
      const animBtn = document.getElementById("animBtn");

      // Shapes in world coordinates
      const A = [
        [1, 1],
        [-1, 1],
        [-1, -1],
        [1, -1],
      ];
      const B = [
        [5, -2],
        [4, 3],
        [1, 0],
        [3, -2],
      ];

      // Origin in canvas pixels, scale
      const W = 680,
        H = 420;
      canvas.width = W;
      canvas.height = H;
      const ox = 190,
        oy = 230,
        sc = 55;

      function wx(cx) {
        return ox + cx * sc;
      }
      function wy(cy) {
        return oy - cy * sc;
      }
      function lerp(a, b, t) {
        return a * (1 - t) + b * t;
      }
      function r2(v) {
        return Math.round(v * 100) / 100;
      }

      function drawGrid() {
        ctx.save();
        ctx.strokeStyle = "rgba(255,255,255,0.04)";
        ctx.lineWidth = 1;
        ctx.setLineDash([]);
        for (let x = -2; x <= 7; x++) {
          ctx.beginPath();
          ctx.moveTo(wx(x), 20);
          ctx.lineTo(wx(x), H - 10);
          ctx.stroke();
        }
        for (let y = -4; y <= 4; y++) {
          ctx.beginPath();
          ctx.moveTo(20, wy(y));
          ctx.lineTo(W - 20, wy(y));
          ctx.stroke();
        }
        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(20, oy);
        ctx.lineTo(W - 20, oy);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(ox, H - 10);
        ctx.lineTo(ox, 10);
        ctx.stroke();
        ctx.fillStyle = "rgba(255,255,255,0.25)";
        ctx.font = "10px monospace";
        ctx.textAlign = "center";
        for (let x = -2; x <= 6; x++) {
          if (x === 0) continue;
          ctx.fillText(x, wx(x), oy + 14);
        }
        ctx.textAlign = "right";
        for (let y = -3; y <= 3; y++) {
          if (y === 0) continue;
          ctx.fillText(y, ox - 6, wy(y) + 4);
        }
        ctx.restore();
      }

      function polyPath(pts) {
        ctx.beginPath();
        pts.forEach(([cx, cy], i) => {
          i === 0 ? ctx.moveTo(wx(cx), wy(cy)) : ctx.lineTo(wx(cx), wy(cy));
        });
        ctx.closePath();
      }

      function drawShape(pts, color, alpha) {
        ctx.save();
        ctx.setLineDash([]);
        ctx.lineJoin = "round";
        ctx.strokeStyle = color;
        ctx.lineWidth = 1.8;
        // fill
        polyPath(pts);
        ctx.globalAlpha = alpha * 0.1;
        ctx.fillStyle = color;
        ctx.fill();
        // stroke
        ctx.globalAlpha = alpha;
        ctx.stroke();
        // vertex dots
        pts.forEach(([cx, cy]) => {
          ctx.beginPath();
          ctx.arc(wx(cx), wy(cy), 4, 0, Math.PI * 2);
          ctx.fillStyle = color;
          ctx.globalAlpha = alpha;
          ctx.fill();
        });
        ctx.restore();
      }

      function drawP(pts, t) {
        ctx.save();
        ctx.setLineDash([8, 4]);
        ctx.strokeStyle = "#4affa0";
        ctx.lineWidth = 2.5;
        ctx.lineJoin = "round";
        polyPath(pts);
        ctx.globalAlpha = 0.15;
        ctx.fillStyle = "#4affa0";
        ctx.fill();
        ctx.globalAlpha = 1;
        ctx.stroke();
        ctx.setLineDash([]);
        pts.forEach(([cx, cy]) => {
          ctx.shadowBlur = 12;
          ctx.shadowColor = "#4affa0";
          ctx.beginPath();
          ctx.arc(wx(cx), wy(cy), 6, 0, Math.PI * 2);
          ctx.fillStyle = "#4affa0";
          ctx.globalAlpha = 1;
          ctx.fill();
        });
        ctx.shadowBlur = 0;
        ctx.restore();
      }

      function drawConnectors(t, pPts) {
        ctx.save();
        ctx.setLineDash([3, 3]);
        ctx.lineWidth = 1;
        A.forEach(([ax, ay], i) => {
          const [bx, by] = B[i];
          const [ppx, ppy] = pPts[i];
          ctx.strokeStyle = "#4a9eff";
          ctx.globalAlpha = Math.max(0.08, 0.5 * (1 - t));
          ctx.beginPath();
          ctx.moveTo(wx(ax), wy(ay));
          ctx.lineTo(wx(ppx), wy(ppy));
          ctx.stroke();
          ctx.strokeStyle = "#ff6b4a";
          ctx.globalAlpha = Math.max(0.08, 0.5 * t);
          ctx.beginPath();
          ctx.moveTo(wx(bx), wy(by));
          ctx.lineTo(wx(ppx), wy(ppy));
          ctx.stroke();
        });
        ctx.restore();
      }

      function drawLabels(t, pPts) {
        ctx.save();
        ctx.setLineDash([]);
        ctx.font = "bold 12px monospace";
        ctx.globalAlpha = 0.8;
        ctx.fillStyle = "#4a9eff";
        ctx.textAlign = "left";
        ctx.fillText("A (Square)", wx(-1.6), wy(1.4));
        ctx.fillStyle = "#ff6b4a";
        ctx.fillText("B (Wedge)", wx(3.8), wy(3.4));
        ctx.fillStyle = "#4affa0";
        ctx.globalAlpha = 1;
        const [px2, py2] = pPts[1];
        ctx.fillText("P(" + t.toFixed(2) + ")", wx(px2) + 10, wy(py2) - 8);
        ctx.restore();
      }

      function draw(t) {
        ctx.clearRect(0, 0, W, H);
        drawGrid();
        const pPts = A.map(([ax, ay], i) => [
          lerp(ax, B[i][0], t),
          lerp(ay, B[i][1], t),
        ]);
        drawConnectors(t, pPts);
        drawShape(A, "#4a9eff", 0.5);
        drawShape(B, "#ff6b4a", 0.5);
        drawP(pPts, t);
        drawLabels(t, pPts);
      }

      function updateUI(tRaw) {
        const t = tRaw / 100;
        const a1 = r2(1 - t),
          b1 = r2(t);
        tvalEl.textContent = t.toFixed(2);
        formulaEl.innerHTML = `P = <span class="fa">${a1} × A</span> + <span class="fb">${b1} × B</span>`;

        // gradient on slider
        slider.style.setProperty("--pct", tRaw + "%");

        // table
        const pPts = A.map(([ax, ay], i) => [
          lerp(ax, B[i][0], t),
          lerp(ay, B[i][1], t),
        ]);
        tbody.innerHTML = pPts
          .map(([px2, py2], [...rest], i) => {
            const row = pPts[i];
            return `<tr>
      <td class="cn">${i + 1}</td>
      <td class="ca">(${A[i][0]}, ${A[i][1]})</td>
      <td class="cn">×${a1}</td>
      <td class="cb">(${B[i][0]}, ${B[i][1]})</td>
      <td class="cn">×${b1}</td>
      <td class="cp">(${r2(row[0])}, ${r2(row[1])})</td>
    </tr>`;
          })
          .join("");

        // buttons
        document
          .querySelectorAll(".btn-row button")
          .forEach((b) => b.classList.remove("active"));
        const map = { 0: "b0", 25: "b25", 50: "b50", 75: "b75", 100: "b100" };
        if (map[tRaw])
          document.getElementById(map[tRaw])?.classList.add("active");

        draw(t);
      }

      slider.addEventListener("input", (e) => updateUI(+e.target.value));

      // Preset buttons
      [
        [0, "b0"],
        [25, "b25"],
        [50, "b50"],
        [75, "b75"],
        [100, "b100"],
      ].forEach(([v, id]) => {
        document.getElementById(id).addEventListener("click", () => {
          slider.value = v;
          updateUI(v);
        });
      });

      // Animate
      let animating = false,
        animDir = 1,
        animT = 50,
        animFrame;
      animBtn.addEventListener("click", () => {
        animating = !animating;
        animBtn.textContent = animating ? "⏸ Pause" : "▶ Animate";
        if (animating) animate();
        else cancelAnimationFrame(animFrame);
      });

      function animate() {
        animT += animDir * 0.8;
        if (animT >= 100) {
          animT = 100;
          animDir = -1;
        }
        if (animT <= 0) {
          animT = 0;
          animDir = 1;
        }
        slider.value = animT;
        updateUI(animT);
        animFrame = requestAnimationFrame(animate);
      }

      updateUI(50);
    </script>
  </body>
</html>
